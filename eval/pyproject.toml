[project]
name = "makaar-eval"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4", "rapidfuzz>=3"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/makaar_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
