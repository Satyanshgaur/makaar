[package]
name = "makaar-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "makaar desktop app: offline notes to Markdown, LaTeX and Word"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
makaar-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
