name: ci
on: [pull_request, push]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Unit tests
        run: cd eval && uv run pytest -q
      - name: Licence gate
        run: python3 scripts/check_licenses.py
      - name: Accuracy/speed gates on committed results (if any)
        run: |
          cd eval
          for f in results/*.json; do [ -e "$f" ] || exit 0; uv run python -m makaar_eval.gates "$f"; done
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust tests and clippy
        run: cd core && cargo test --locked && cargo clippy --locked -- -D warnings
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build and clippy the desktop app
        run: cd desktop && cargo clippy --locked -- -D warnings
