name: release
# Builds the makaar CLI for each desktop platform. On a v* tag the archives are attached to a
# GitHub release; run it by hand (workflow_dispatch) to get them as workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, exe: makaar }
          - { os: ubuntu-24.04-arm, target: linux-arm64, exe: makaar }
          - { os: macos-latest, target: macos-arm64, exe: makaar }
          - { os: windows-latest, target: windows-x64, exe: makaar.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cd core && cargo build --release --locked --bin makaar
      - name: Smoke test
        shell: bash
        run: |
          core/target/release/${{ matrix.exe }} --version
          core/target/release/${{ matrix.exe }} models --dir "$RUNNER_TEMP/none" | grep -q missing
      - name: Package
        shell: bash
        run: |
          name=makaar-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}
          mkdir "$name"
          cp core/target/release/${{ matrix.exe }} README.md LICENSE "$name/"
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
          echo "ASSET=$(ls $name.*)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: makaar-${{ matrix.target }}
          path: ${{ env.ASSET }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "See README: run \`makaar setup\` first."; gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
